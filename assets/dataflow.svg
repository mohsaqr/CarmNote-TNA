<svg width="1300" height="740" viewBox="0 0 1300 740" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1300" height="740" fill="#FFFFFF"/>

<!-- Phase labels -->
<text x="160" y="52" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#185FA5">INGEST</text>
<text x="495" y="52" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#854F0B">BUILD</text>
<text x="835" y="52" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#993C1D">ANALYZE</text>
<text x="1135" y="52" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#0F6E56">RENDER</text>

<!-- Legend -->
<text x="1260" y="86" font-size="11" font-style="italic" text-anchor="end" fill="#5F5E5A">solid = calls / produces</text>
<text x="1260" y="104" font-size="11" font-style="italic" text-anchor="end" fill="#5F5E5A">dashed = returns / reads</text>

<!-- Data input -->
<rect x="40" y="70" width="240" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="160" y="96" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">Data input</text>
<text x="160" y="118" font-size="12" font-style="italic" text-anchor="middle" fill="#5F5E5A">dropped CSV / TSV file</text>

<line x1="160" y1="132" x2="160" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Data ingestion -->
<rect x="40" y="162" width="240" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="160" y="188" font-size="15" font-weight="600" text-anchor="middle" fill="#0C447C">Data ingestion</text>
<text x="160" y="210" font-size="12" font-style="italic" text-anchor="middle" fill="#185FA5">reads and parses the file,</text>
<text x="160" y="228" font-size="12" font-style="italic" text-anchor="middle" fill="#185FA5">detects layout and column roles</text>

<!-- loads data into -->
<path d="M280 204 H460 V256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="300" y="196" font-size="12" font-style="italic" fill="#5F5E5A">loads data into</text>

<!-- Working document -->
<rect x="330" y="260" width="330" height="84" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="495" y="286" font-size="15" font-weight="600" text-anchor="middle" fill="#633806">Working document — in-memory state</text>
<text x="495" y="308" font-size="12" font-style="italic" text-anchor="middle" fill="#854F0B">the one object every stage reads and writes:</text>
<text x="495" y="326" font-size="12" font-style="italic" text-anchor="middle" fill="#854F0B">sequences · metadata · model · analysis cells</text>

<!-- reads / writes -->
<line x1="430" y1="344" x2="430" y2="436" stroke="#854F0B" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="422" y="394" font-size="12" font-style="italic" text-anchor="end" fill="#854F0B">reads sequences</text>
<line x1="560" y1="440" x2="560" y2="348" stroke="#854F0B" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="568" y="394" font-size="12" font-style="italic" fill="#854F0B">writes model</text>

<!-- Network construction -->
<rect x="360" y="440" width="270" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
<text x="495" y="466" font-size="15" font-weight="600" text-anchor="middle" fill="#0C447C">Network construction</text>
<text x="495" y="488" font-size="12" font-style="italic" text-anchor="middle" fill="#185FA5">turns sequences into a</text>
<text x="495" y="506" font-size="12" font-style="italic" text-anchor="middle" fill="#185FA5">transition-network model</text>

<!-- Working doc to Analysis units -->
<path d="M660 302 H685 V182 H706" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Analysis units -->
<rect x="710" y="140" width="250" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="835" y="166" font-size="15" font-weight="600" text-anchor="middle" fill="#712B13">Analysis units</text>
<text x="835" y="188" font-size="12" font-style="italic" text-anchor="middle" fill="#993C1D">network · sequence · validation</text>
<text x="835" y="206" font-size="12" font-style="italic" text-anchor="middle" fill="#993C1D">comparison · high-order families</text>

<!-- Analysis to Rendering -->
<line x1="960" y1="182" x2="1006" y2="182" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ag)"/>

<!-- Rendering backbone -->
<rect x="1010" y="140" width="250" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="1135" y="166" font-size="15" font-weight="600" text-anchor="middle" fill="#085041">Rendering backbone</text>
<text x="1135" y="188" font-size="12" font-style="italic" text-anchor="middle" fill="#0F6E56">shared figure and table builders</text>
<text x="1135" y="206" font-size="12" font-style="italic" text-anchor="middle" fill="#0F6E56">plots · charts · tables</text>

<!-- runs numerics / returns results -->
<line x1="790" y1="224" x2="790" y2="466" stroke="#993C1D" stroke-width="1.5" marker-end="url(#ac)"/>
<text x="782" y="350" font-size="12" font-style="italic" text-anchor="end" fill="#993C1D">runs numerics</text>
<line x1="880" y1="470" x2="880" y2="228" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac)"/>
<text x="888" y="360" font-size="12" font-style="italic" fill="#993C1D">returns results</text>

<!-- Numerical engine -->
<rect x="710" y="470" width="250" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="835" y="496" font-size="15" font-weight="600" text-anchor="middle" fill="#712B13">Numerical engine</text>
<text x="835" y="518" font-size="12" font-style="italic" text-anchor="middle" fill="#993C1D">all statistics and algorithms</text>
<text x="835" y="536" font-size="12" font-style="italic" text-anchor="middle" fill="#993C1D">(verified against R reference)</text>

<!-- draws into page -->
<line x1="1135" y1="224" x2="1135" y2="466" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="1143" y="350" font-size="12" font-style="italic" fill="#5F5E5A">draws into page</text>

<!-- Rendered output -->
<rect x="1010" y="470" width="250" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="1135" y="496" font-size="15" font-weight="600" text-anchor="middle" fill="#2C2C2A">Rendered output</text>
<text x="1135" y="518" font-size="12" font-style="italic" text-anchor="middle" fill="#5F5E5A">on-screen cells: figures and</text>
<text x="1135" y="536" font-size="12" font-style="italic" text-anchor="middle" fill="#5F5E5A">tables, ready to export</text>

<!-- saves and restores (two-way) -->
<path d="M330 302 H160 V456" fill="none" stroke="#534AB7" stroke-width="1.5" marker-start="url(#ap)" marker-end="url(#ap)"/>
<text x="172" y="390" font-size="12" font-style="italic" fill="#534AB7">saves and restores</text>

<!-- Persist -->
<text x="160" y="444" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#534AB7">PERSIST</text>

<!-- Local persistence -->
<rect x="40" y="460" width="240" height="106" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="160" y="486" font-size="15" font-weight="600" text-anchor="middle" fill="#26215C">Local persistence</text>
<text x="160" y="508" font-size="12" font-style="italic" text-anchor="middle" fill="#534AB7">saves the document and restores</text>
<text x="160" y="526" font-size="12" font-style="italic" text-anchor="middle" fill="#534AB7">it on re-open — nothing</text>
<text x="160" y="544" font-size="12" font-style="italic" text-anchor="middle" fill="#534AB7">leaves the machine</text>

<line x1="160" y1="566" x2="160" y2="606" stroke="#534AB7" stroke-width="1.5" marker-end="url(#ap)"/>

<!-- Storage & seal -->
<rect x="40" y="610" width="240" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="160" y="636" font-size="15" font-weight="600" text-anchor="middle" fill="#26215C">Storage and seal</text>
<text x="160" y="658" font-size="12" font-style="italic" text-anchor="middle" fill="#534AB7">browser-local storage, embedded</text>
<text x="160" y="676" font-size="12" font-style="italic" text-anchor="middle" fill="#534AB7">state slot, reproducibility seal</text>
</svg>
